<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Investment Dashboard</title>
  </head>
  <body>
    <div id="root">
      <main
        style="min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #f8fafc; background: radial-gradient(circle at top left, rgba(34, 211, 238, 0.2), transparent 30%), #030712; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;"
      >
        <section
          style="max-width: 680px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; padding: 32px; background: rgba(15, 23, 42, 0.86); box-shadow: 0 24px 80px rgba(8, 47, 73, 0.35);"
        >
          <p style="margin: 0 0 12px; color: #67e8f9; font-size: 12px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;">
            Crypto Investment Dashboard
          </p>
          <h1 style="margin: 0; font-size: clamp(32px, 8vw, 64px); line-height: 0.95;">
            Start the Vite dev server
          </h1>
          <p style="margin: 18px 0 0; color: #cbd5e1; font-size: 18px; line-height: 1.7;">
            If you opened this file directly from VS Code or a file browser, the
            React/TypeScript app cannot load. Run
            <code style="color: #fde68a;">npm install</code> and
            <code style="color: #fde68a;">npm run dev</code>, then open the
            localhost URL printed in the terminal.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
